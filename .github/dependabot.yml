version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # A imagem do Postgres está no docker-compose.yml (não há Dockerfile)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Major do Postgres exige pg_upgrade do volume de dados; atualizar à mão
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
